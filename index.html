<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hes_VPN Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h1 {
            color: #38bdf8;
            font-size: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card h3 {
            font-size: 15px;
            margin: 0 0 4px 0;
            text-align: right;
        }
        .card span {
            color: #38bdf8;
            font-size: 13px;
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 فروشگاه Hes_VPN</h1>
        <p id="greeting">لطفاً پلن مورد نظر خود را انتخاب کنید:</p>
    </div>

    <div class="card">
        <div>
            <h3>⚡ ۱۰ گیگابایت (۱ ماهه)</h3>
            <span>۵۰,۰۰۰ تومان</span>
        </div>
        <button class="btn" onclick="buyPlan('۱۰ گیگابایت', '۵۰,۰۰۰ تومان')">خرید</button>
    </div>

    <div class="card">
        <div>
            <h3>🔥 ۲۰ گیگابایت (۱ ماهه)</h3>
            <span>۱۰۰,۰۰۰ تومان</span>
        </div>
        <button class="btn" onclick="buyPlan('۲۰ گیگابایت', '۱۰۰,۰۰۰ تومان')">خرید</button>
    </div>

    <div class="card">
        <div>
            <h3>💎 ۳۰ گیگابایت (۱ ماهه)</h3>
            <span>۱۵۰,۰۰۰ تومان</span>
        </div>
        <button class="btn" onclick="buyPlan('۳۰ گیگابایت', '۱۵۰,۰۰۰ تومان')">خرید</button>
    </div>

    <div class="card">
        <div>
            <h3>👑 نامحدود (۱ ماهه)</h3>
            <span>۳۵۰,۰۰۰ تومان</span>
        </div>
        <button class="btn" onclick="buyPlan('نامحدود ماهانه', '۳۵۰,۰۰۰ تومان')">خرید</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('greeting').innerText = `سلام ${tg.initDataUnsafe.user.first_name} عزیز، پلن خود را انتخاب کنید:`;
        }

        function buyPlan(planName, planPrice) {
            const data = {
                action: "buy_plan",
                plan: planName,
                price: planPrice
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
